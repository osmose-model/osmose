project:
  type: book

book:
  title: "Osmose documentation"
  author: "Norah Jones"
  chapters:
    - index.qmd
    - user_guide.qmd
    - odd_des.qmd

  search: true
  repo-url: https://github.com/osmose-model/osmose/
  repo-actions: [edit]
  downloads: [pdf]
  sidebar:
    style: "docked"
    logo: _static/logo-osmose.svg
  favicon: _static/logo-osmose.svg
  page-navigation: true


bibliography: _static/biblio.bib

execute:
  cache: true

jupyter: ir

format:
  html:
    number-sections: true
    theme: cosmo

  pdf:
    fontfamily: libertinus